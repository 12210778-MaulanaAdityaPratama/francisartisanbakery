services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fab_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    networks:
      - fab_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: fab_nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - fab_network
    depends_on:
      - app

  db:
    image: postgres:16-alpine
    container_name: fab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: francisartisanbakery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - fab_network

volumes:
  pgdata:
    driver: local

networks:
  fab_network:
    driver: bridge
